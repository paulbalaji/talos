name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            zig_target: x86_64-linux
            zig_sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          - os: macos-15
            zig_target: aarch64-macos
            zig_sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          distribution="zig-$ZIG_TARGET-0.15.2"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "https://ziglang.org/download/0.15.2/$distribution.tar.xz" --output zig.tar.xz
          printf '%s  zig.tar.xz\n' "$ZIG_SHA256" | shasum -a 256 -c
          tar -xf zig.tar.xz
          echo "$RUNNER_TEMP/$distribution" >> "$GITHUB_PATH"
      - name: Check formatting
        run: zig fmt --check build.zig src
      - name: Run tests
        run: zig build test
      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe
          zig-out/bin/talos --help

  conventions:
    name: Commit conventions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              if ! .githooks/check-conventional "$PR_TITLE"; then
                echo 'Use a Conventional Commit PR title such as feat(cli): add a status option.'
                exit 1
              fi
              revisions=("$PR_BASE..$PR_HEAD")
              ;;
            push)
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
                revisions=("$GITHUB_SHA")
              else
                revisions=("$PUSH_BEFORE..$GITHUB_SHA")
              fi
              ;;
            *)
              revisions=(-1 "$GITHUB_SHA")
              ;;
          esac
          subjects="$RUNNER_TEMP/talos-commit-subjects"
          git log --no-merges --format='%h %s' "${revisions[@]}" > "$subjects"
          failed=0
          while IFS= read -r entry; do
            if ! .githooks/check-conventional "${entry#* }"; then
              printf 'Commit %s needs a Conventional Commit subject.\n' "${entry%% *}"
              failed=1
            fi
          done < "$subjects"
          exit "$failed"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          printf '%s  gitleaks.tar.gz\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb | sha256sum -c
          tar -xf gitleaks.tar.gz gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner "$GITHUB_WORKSPACE"
