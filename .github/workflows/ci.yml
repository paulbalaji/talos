name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            zig_target: x86_64-linux
            zig_sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          - os: macos-15
            zig_target: aarch64-macos
            zig_sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Zig
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          distribution="zig-$ZIG_TARGET-0.15.2"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "https://ziglang.org/download/0.15.2/$distribution.tar.xz" --output zig.tar.xz
          printf '%s  zig.tar.xz\n' "$ZIG_SHA256" | shasum -a 256 -c
          tar -xf zig.tar.xz
          echo "$RUNNER_TEMP/$distribution" >> "$GITHUB_PATH"
      - name: Check formatting
        run: zig fmt --check build.zig src
      - name: Run tests
        run: zig build test
      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe
          zig-out/bin/talos --help

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          printf '%s  gitleaks.tar.gz\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb | sha256sum -c
          tar -xf gitleaks.tar.gz gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner "$GITHUB_WORKSPACE"
